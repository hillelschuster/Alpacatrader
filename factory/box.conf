# box.conf - settings for factory/scripts/box.sh (no secrets here; key auth only)
#
# Every key can be overridden by an environment variable of the same name
# (BOX_CACHE_ROOT=... box status). Paths may use ~ and $HOME.

# rclone remote + prefix that holds the project's data (see storagebox:alpacatrader/README.md)
REMOTE=storagebox:alpacatrader

# rclone binary
RCLONE=rclone

# Local cache root: every dataset is extracted under this directory, mirroring the
# archived local path (e.g. alpha-data/open-search-v1/quote_universe_acquire/quotes/,
# data/backfill/clean_ohlcv_2026-03.parquet). Cold restores go to restore/<dest-name>/.
CACHE_ROOT=~/boxcache

# Hard budget for CACHE_ROOT, in GB (10^9 bytes). `box pull`/`box set` warn when a pull
# would exceed it; `box set` refuses a set whose total exceeds it (unless --force);
# `box evict --lru N` frees N GB oldest-first.
CACHE_CAP_GB=20

# Symlinks created by `box link` so existing code finds data with no edits:
#   ~/alpha-data   -> CACHE_ROOT/alpha-data          (research root: Path.home()/"alpha-data")
#   ~/sip          -> CACHE_ROOT/data/sip            (repo data/sip/net -> ~/sip/net)
#   <repo>/data    -> CACHE_ROOT/data                (PANEL_DATA_ROOT = REPO/data)
# Disable individual links by removing them from this list.
LINKS=alpha-data,sip,repo-data

# Live bot state, kept reachable after repo data -> CACHE_ROOT/data: `box link` makes
# CACHE_ROOT/data/forward a symlink to this directory (never a copy; nothing inside it is
# read, written or moved by box). Leave empty to disable. The Windows path survives because
# the migration kept data/forward on the Windows disk untouched.
BOT_FORWARD=/mnt/c/Users/הלל/Desktop/algo projects/Alpacatrader/data/forward

# Extra rclone flags for downloads (keep empty on the box's SFTP: checksums are not supported)
RCLONE_FLAGS=
